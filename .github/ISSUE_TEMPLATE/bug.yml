name: 不具合の報告 / Bug report
description: Jotteo がうまく動かないとき / Something in Jotteo isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issue は誰でも読めます。ノートの内容や個人情報は書かない・添付しないでください。
        Issues are public. Please do not include the contents of your notes or personal information.
  - type: input
    id: version
    attributes:
      label: Jotteo の版 / Jotteo version
      description: 設定 > このアプリについて / Settings > About
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Windows の版、PC の機種・ペン / Windows version, PC model and pen
  - type: textarea
    id: what
    attributes:
      label: 何をしたら、どうなったか / What you did and what happened
      description: 期待した動作も書いてください / Please also describe what you expected
    validations:
      required: true
